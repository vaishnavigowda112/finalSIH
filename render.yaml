services:
  - type: web
    name: kisanmandi-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        value: ""
      - key: DATA_GOV_IN_API_KEY
        value: ""
      - key: AGMARKNET_API_KEY
        value: ""
      - key: APP_URL
        value: https://your-render-service-url
